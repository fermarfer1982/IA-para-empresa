server {
    listen 443 ssl http2;
    server_name agente-infra.local infra-agent.local;

    ssl_certificate /etc/pki/tls/certs/infra-agent-web.crt;
    ssl_certificate_key /etc/pki/tls/private/infra-agent-web.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:InfraAgentSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
